<svg xmlns="http://www.w3.org/2000/svg" width="880" height="110" viewBox="0 0 880 110" role="img" aria-label="sponsor slot placeholder">
  <!-- README 顶部赞助位占位图：中性灰，深浅色主题下都清晰；文案不写在图里，
       由各语言 README 自己给（中英两份共用这一张，图片集合才能一一对应）。 -->
  <rect x="1.5" y="1.5" width="877" height="107" rx="14"
        fill="none" stroke="#8b949e" stroke-opacity="0.5"
        stroke-width="1.5" stroke-dasharray="8 7"/>
  <g fill="#8b949e" fill-opacity="0.85"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif">
    <circle cx="440" cy="43" r="15" fill="none" stroke="#8b949e" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M440 36.5v13M433.5 43h13" stroke="#8b949e" stroke-opacity="0.7" stroke-width="1.5" stroke-linecap="round"/>
    <text x="440" y="82" text-anchor="middle" font-size="13" letter-spacing="0.5">SPONSOR SLOT</text>
  </g>
</svg>
